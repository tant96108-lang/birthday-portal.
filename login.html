<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log In - Birthday Portal</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="birthday-bg">

  <!-- Background Floating Decorative Elements -->
  <div class="balloon balloon-1">🎈</div>
  <div class="balloon balloon-2">🎈</div>
  <div class="confetti confetti-1">✨</div>
  <div class="confetti confetti-2">🎉</div>

  <div class="auth-container">
    <div class="card birthday-card">
      <div class="header-icon">🎉</div>
      <h2>Happy birthday MIMI!</h2>
      <p>Enter your birthday date to join the celebration.</p>

      <form id="loginForm">
        <div class="input-group">
          <label for="loginBirthday">Your Birthday</label>
          <input type="date" id="loginBirthday" required>
        </div>

        <div class="input-group">
          <label for="loginPassword">imong nickname</label>
          <input type="password" id="loginPassword" placeholder="••••••••" required>
        </div>

        <button type="submit" id="loginBtn" class="primary-btn celebration-btn">
          ✨ Log In
        </button>
      </form>

      <!-- Link back to signup.html -->
      <p class="auth-switch">
        Don't have an account? <a href="signup.html">Create an Account</a>
      </p>
    </div>
  </div>

  <!-- 1. Supabase CDN Library (MUST BE FIRST) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- 2. Global Supabase Client Init (MUST BE SECOND) -->
  <script src="supabaseClient.js"></script>

  <!-- 3. Login JavaScript Logic (MUST BE LAST) -->
  <script src="login.js"></script>
</body>
</html>
