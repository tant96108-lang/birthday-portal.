<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Join the Party - Birthday Portal</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="birthday-bg">

  <!-- Background Floating Decorative Elements -->
  <div class="balloon balloon-1">🎈</div>
  <div class="balloon balloon-2">🎈</div>
  <div class="confetti confetti-1">✨</div>
  <div class="confetti confetti-2">🎉</div>

  <div class="auth-container">
    <div class="card birthday-card">
      <div class="header-icon">🎂</div>
      <h2>Join the Celebration!</h2>
      <p>Create an account to start sharing and receiving birthday magic.</p>

      <form id="signupForm">
        <div class="input-group">
          <label for="signupName">Full Name</label>
          <input type="text" id="signupName" placeholder="e.g., Alex Smith" required>
        </div>

        <div class="input-group">
          <label for="signupBirthday">Your Birthday Date</label>
          <input type="date" id="signupBirthday" required>
        </div>

        <div class="input-group">
          <label for="signupPassword">Password</label>
          <input type="password" id="signupPassword" placeholder="••••••••" minlength="6" required>
        </div>

        <button type="submit" id="signupBtn" class="primary-btn celebration-btn">
          🎁 Create Account
        </button>
      </form>

      <p class="auth-switch">
        Already have an account? <a href="login.html">Log In here</a>
      </p>
    </div>
  </div>

  <!-- 1. Supabase CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
  <!-- 2. Supabase Client Initialization -->
  <script src="supabaseClient.js"></script>

  <!-- 3. External JavaScript File -->
  <script src="signup.js"></script>
</body>
</html>
