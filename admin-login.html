<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login - Birthday Portal</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .login-container {
      max-width: 400px;
      margin: 80px auto;
      padding: 30px;
      background: #ffffff;
      border: 2px solid #fecfef;
      border-radius: 16px;
      box-shadow: 0 4px 15px rgba(255, 154, 158, 0.15);
      text-align: center;
    }
    .form-group {
      margin-bottom: 15px;
      text-align: left;
    }
    .form-group label {
      display: block;
      font-weight: bold;
      color: #d63384;
      margin-bottom: 5px;
    }
    .form-group input {
      width: 100%;
      padding: 10px;
      border: 2px solid #e9ecef;
      border-radius: 8px;
      box-sizing: border-box;
    }
    .error-msg {
      color: red;
      font-size: 0.85rem;
      margin-top: 10px;
      display: none;
    }
  </style>
</head>
<body class="birthday-bg">

  <div class="login-container">
    <h2 style="color: #d63384;">👑 Admin Portal Login</h2>
    <p style="color: #6c757d; font-size: 0.9rem;">Enter your administrative credentials</p>

    <form id="adminLoginForm">
      <div class="form-group">
        <label for="adminEmail">Admin Email</label>
        <input type="email" id="adminEmail" placeholder="e.g. birthday@example.com" required>
      </div>
      <div class="form-group">
        <label for="adminPassword">Password</label>
        <input type="password" id="adminPassword" placeholder="••••••••" required>
      </div>
      <button type="submit" id="loginBtn" class="celebration-btn" style="width: 100%; margin-top: 10px;">
        🔓 Log In as Admin
      </button>
      <div id="errorMsg" class="error-msg"></div>
    </form>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabaseClient.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const form = document.getElementById("adminLoginForm");
      const emailInput = document.getElementById("adminEmail");
      const passwordInput = document.getElementById("adminPassword");
      const loginBtn = document.getElementById("loginBtn");
      const errorMsg = document.getElementById("errorMsg");

      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        errorMsg.style.display = "none";
        loginBtn.disabled = true;
        loginBtn.innerText = "Authenticating...";

        // 1. Sign in directly with Supabase Auth using Email and Password
        const { data, error } = await window.supabaseClient.auth.signInWithPassword({
          email: emailInput.value.trim(),
          password: passwordInput.value
        });

        if (error) {
          showError("Login failed: " + error.message);
          return;
        }

        // 2. Verify admin metadata role
        const user = data.user;
        const isUserAdmin = 
          user?.user_metadata?.role === "admin" || 
          user?.app_metadata?.role === "admin";

        if (isUserAdmin) {
          // Redirect to Admin Dashboard
          window.location.href = "admin.html";
        } else {
          // Reject non-admin users logging in via admin interface
          await window.supabaseClient.auth.signOut();
          showError("Access denied. This account does not have admin privileges.");
        }
      });

      function showError(message) {
        loginBtn.disabled = false;
        loginBtn.innerText = "🔓 Log In as Admin";
        errorMsg.textContent = message;
        errorMsg.style.display = "block";
      }
    });
  </script>
</body>
</html>
