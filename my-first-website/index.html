<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Birthday Wish System (BMS)</title>
  <link rel="stylesheet" href="style.css">
  
  <!-- Supabase JS Library -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

  <div class="dashboard">
    <header>
      <h1>🎉 Birthday Wish Portal</h1>
      <p>Send personalized greetings & track RSVPs</p>
    </header>

    <!-- Section 1: Create a Greeting Card -->
    <section class="card">
      <h2>Create New Wish</h2>
      <form id="wishForm">
        <input type="text" id="nameInput" placeholder="Celebrant's Name" required>
        <textarea id="messageInput" placeholder="Write a special birthday greeting..." rows="3" required></textarea>
        <button type="submit">Publish Greeting</button>
      </form>
    </section>

    <!-- Section 2: Active Birthday Feed -->
    <section class="card">
      <h2>Active Birthday Feed</h2>
      <div id="feed">
        <p class="empty-state">Loading greetings...</p>
      </div>
    </section>
  </div>

  <script src="script.js"></script>
</body>
</html>
