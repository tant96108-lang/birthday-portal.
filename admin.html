<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard - Birthday Portal</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #2b0006;
      color: #fff;
      padding: 20px;
      margin: 0;
    }
    .admin-container {
      width: 100%;
      max-width: 750px;
      margin: 40px auto;
      padding: 0 10px;
      box-sizing: border-box;
    }
    .admin-card {
      background: #ffffff;
      color: #333;
      border: 2px solid #fecfef;
      border-radius: 16px;
      padding: 25px;
      box-shadow: 0 4px 15px rgba(255, 154, 158, 0.15);
      margin-bottom: 25px;
    }
    .admin-card h2, .admin-card h3 {
      color: #d63384;
      margin-top: 0;
      margin-bottom: 15px;
    }
    .header-card {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .form-group {
      margin-bottom: 15px;
    }
    .form-group label {
      display: block;
      font-weight: 600;
      color: #d63384;
      margin-bottom: 5px;
    }
    .form-group select, 
    .form-group textarea,
    .form-group input[type="text"],
    .form-group input[type="file"] {
      width: 100%;
      padding: 10px;
      border: 2px solid #e9ecef;
      border-radius: 10px;
      box-sizing: border-box;
      font-family: inherit;
      font-size: 0.95rem;
    }
    .form-group select:focus, 
    .form-group textarea:focus,
    .form-group input:focus {
      outline: none;
      border-color: #d63384;
    }
    .celebration-btn {
      width: 100%;
      background: #e60023;
      color: white;
      border: none;
      padding: 12px;
      border-radius: 10px;
      font-weight: bold;
      font-size: 1rem;
      cursor: pointer;
      transition: background 0.2s ease, transform 0.1s ease;
    }
    .celebration-btn:hover {
      background: #c4001e;
      transform: translateY(-1px);
    }
    .celebration-btn:disabled {
      background: #ccc;
      cursor: not-allowed;
    }
    .secondary-btn {
      background: #d63384;
    }
    .secondary-btn:hover {
      background: #b5226c;
    }
    .logout-btn {
      width: auto;
      padding: 8px 16px;
      background: linear-gradient(45deg, #ff6b6b, #d63384);
    }
    .feedback-item {
      background: #fff5f8;
      border: 1px solid #fecfef;
      border-radius: 10px;
      padding: 15px;
      margin-bottom: 10px;
    }
    .feedback-user {
      font-weight: bold;
      color: #d63384;
    }
    .feedback-time {
      font-size: 0.8rem;
      color: #888;
      margin-top: 5px;
    }
    .image-preview {
      max-width: 100%;
      max-height: 200px;
      border-radius: 8px;
      margin-top: 10px;
      display: none;
    }
    .avatar-preview {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid #d63384;
      margin-top: 10px;
      display: none;
    }
  </style>
</head>
<body class="birthday-bg">

  <div class="admin-container">
    <!-- Header -->
    <div class="admin-card header-card">
      <h2>👑 Admin Control Panel</h2>
      <button id="adminLogoutBtn" class="celebration-btn logout-btn">Log Out</button>
    </div>

    <!-- Manage User Profile Photo -->
    <div class="admin-card">
      <h3>🖼️ Manage User Profile Picture</h3>
      <div class="form-group">
        <label for="avatarUserSelect">Select Registered User:</label>
        <select id="avatarUserSelect">
          <option value="">Loading accounts from Supabase...</option>
        </select>
      </div>

      <div class="form-group">
        <label for="avatarFileInput">Choose Profile Photo File:</label>
        <input type="file" id="avatarFileInput" accept="image/*">
        <img id="avatarPreview" class="avatar-preview" alt="Avatar Preview">
      </div>

      <button id="updateAvatarBtn" class="celebration-btn secondary-btn">Update Profile Photo 📸</button>
    </div>

    <!-- Send Greeting & Picture to Registered User -->
    <div class="admin-card">
      <h3>🎁 Send Greeting & Picture to User</h3>
      <div class="form-group">
        <label for="userSelect">Select Registered Supabase User:</label>
        <select id="userSelect">
          <option value="">Loading accounts from Supabase...</option>
        </select>
      </div>
      
      <div class="form-group">
        <label for="greetingInput">Custom Greeting Message:</label>
        <textarea id="greetingInput" rows="4" placeholder="Type your birthday message here..."></textarea>
      </div>

      <div class="form-group">
        <label for="imageUrlInput">Celebration Picture (Image URL):</label>
        <input type="text" id="imageUrlInput" placeholder="https://example.com/birthday-photo.jpg">
        <img id="imagePreview" class="image-preview" alt="Preview">
      </div>

      <button id="quickSendBtn" class="celebration-btn">Send Direct Greeting & Photo ✨</button>
    </div>

    <!-- Feedback View Feed -->
    <div class="admin-card">
      <h3>💬 Received Celebrant Feedback</h3>
      <div id="feedbackList">
        <p style="color: #6c757d; font-style: italic;">Loading feedback messages...</p>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabaseClient.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", async () => {
      const userSelect = document.getElementById('userSelect');
      const avatarUserSelect = document.getElementById('avatarUserSelect');
      const greetingInput = document.getElementById('greetingInput');
      const imageUrlInput = document.getElementById('imageUrlInput');
      const imagePreview = document.getElementById('imagePreview');
      const quickSendBtn = document.getElementById('quickSendBtn');
      const feedbackList = document.getElementById('feedbackList');
      const adminLogoutBtn = document.getElementById('adminLogoutBtn');

      // Avatar Management DOM Elements
      const avatarFileInput = document.getElementById('avatarFileInput');
      const avatarPreview = document.getElementById('avatarPreview');
      const updateAvatarBtn = document.getElementById('updateAvatarBtn');

      // Live Greeting Image Preview Handler
      imageUrlInput.addEventListener('input', () => {
        const url = imageUrlInput.value.trim();
        if (url) {
          imagePreview.src = url;
          imagePreview.style.display = 'block';
        } else {
          imagePreview.style.display = 'none';
        }
      });

      // Live Avatar File Local Preview Handler
      avatarFileInput.addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (file) {
          avatarPreview.src = URL.createObjectURL(file);
          avatarPreview.style.display = 'block';
        } else {
          avatarPreview.style.display = 'none';
        }
      });

      // Verify Admin Authentication and Admin Role
      const { data: { user }, error: authError } = await window.supabaseClient.auth.getUser();
      const isAdmin = user?.user_metadata?.role === "admin" || user?.app_metadata?.role === "admin";

      if (!user || authError || !isAdmin) {
        alert("Unauthorized access. Redirecting to login...");
        window.location.href = "admin-login.html";
        return;
      }

      // Load all registered user accounts into both dropdown lists
      async function loadRegisteredUsers() {
        const defaultOption = '<option value="">Select a user...</option>';
        userSelect.innerHTML = defaultOption;
        avatarUserSelect.innerHTML = defaultOption;

        const { data, error } = await window.supabaseClient
          .from('profiles')
          .select('id, email, avatar_url');

        if (error) {
          console.error("Error loading users:", error.message);
          userSelect.innerHTML = `<option value="">Error: ${error.message}</option>`;
          avatarUserSelect.innerHTML = `<option value="">Error: ${error.message}</option>`;
          return;
        }

        if (!data || data.length === 0) {
          const noUserOption = '<option value="">No existing user accounts found</option>';
          userSelect.innerHTML = noUserOption;
          avatarUserSelect.innerHTML = noUserOption;
          return;
        }

        data.forEach(userItem => {
          const label = userItem.email || `User: ${userItem.id.slice(0, 8)}...`;
          
          const opt1 = document.createElement("option");
          opt1.value = userItem.id;
          opt1.textContent = label;
          userSelect.appendChild(opt1);

          const opt2 = document.createElement("option");
          opt2.value = userItem.id;
          opt2.dataset.avatar = userItem.avatar_url || '';
          opt2.textContent = label;
          avatarUserSelect.appendChild(opt2);
        });
      }

      // Auto-fill avatar preview when a user is selected in the avatar panel
      avatarUserSelect.addEventListener('change', () => {
        const selectedOption = avatarUserSelect.options[avatarUserSelect.selectedIndex];
        const currentAvatar = selectedOption.dataset.avatar || '';
        
        avatarFileInput.value = ""; // Clear file picker selection
        if (currentAvatar) {
          avatarPreview.src = currentAvatar;
          avatarPreview.style.display = 'block';
        } else {
          avatarPreview.style.display = 'none';
        }
      });

      // Upload selected image file to Supabase Storage and update Profile Avatar
      updateAvatarBtn.addEventListener('click', async () => {
        const selectedUserId = avatarUserSelect.value;
        const file = avatarFileInput.files[0];

        if (!selectedUserId) {
          alert('Please select a user account.');
          return;
        }

        if (!file) {
          alert('Please choose an image file to upload.');
          return;
        }

        updateAvatarBtn.disabled = true;
        updateAvatarBtn.innerText = "Uploading photo...";

        // 1. Upload file to Supabase Storage bucket 'avatars'
        const fileExt = file.name.split('.').pop();
        const fileName = `${selectedUserId}-${Date.now()}.${fileExt}`;
        const filePath = `${fileName}`;

        const { error: uploadError } = await window.supabaseClient.storage
          .from('avatars')
          .upload(filePath, file, { upsert: true });

        if (uploadError) {
          alert('Error uploading file to storage: ' + uploadError.message);
          updateAvatarBtn.disabled = false;
          updateAvatarBtn.innerText = "Update Profile Photo 📸";
          return;
        }

        // 2. Get Public URL of the uploaded image file
        const { data: publicUrlData } = window.supabaseClient.storage
          .from('avatars')
          .getPublicUrl(filePath);

        const newAvatarUrl = publicUrlData.publicUrl;

        // 3. Update profile in the 'profiles' table
        const { error: updateError } = await window.supabaseClient
          .from('profiles')
          .update({ avatar_url: newAvatarUrl })
          .eq('id', selectedUserId);

        updateAvatarBtn.disabled = false;
        updateAvatarBtn.innerText = "Update Profile Photo 📸";

        if (updateError) {
          alert('Error updating user avatar: ' + updateError.message);
        } else {
          alert('User profile photo successfully updated!');
          
          // Force image element to bust browser cache and display new photo instantly
          avatarPreview.src = `${newAvatarUrl}?t=${Date.now()}`;
          avatarPreview.style.display = 'block';

          avatarFileInput.value = ''; // Reset file input
          await loadRegisteredUsers(); // Reload dropdown list with updated dataset
        }
      });

      // Load feedback list
      async function loadFeedback() {
        const { data, error } = await window.supabaseClient
          .from("greetings")
          .select("*")
          .not("feedback", "is", null)
          .order("created_at", { ascending: false });

        if (error) {
          feedbackList.innerHTML = `<p style="color:red;">Error loading feedback: ${escapeHTML(error.message)}</p>`;
          return;
        }

        if (!data || data.length === 0) {
          feedbackList.innerHTML = `<p style="color:#6c757d;">No feedback received yet.</p>`;
          return;
        }

        feedbackList.innerHTML = "";
        data.forEach(item => {
          const div = document.createElement("div");
          div.className = "feedback-item";
          div.innerHTML = `
            <div class="feedback-user">👤 ${escapeHTML(item.name || item.recipient_email || item.celebrant_email || 'Celebrant')}</div>
            <p style="margin: 8px 0;">"${escapeHTML(item.feedback)}"</p>
            <div class="feedback-time">${new Date(item.created_at).toLocaleString()}</div>
          `;
          feedbackList.appendChild(div);
        });
      }

      function escapeHTML(str) {
        if (!str) return '';
        return String(str).replace(/[&<>'"]/g, tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag));
      }

      // Send greeting & image to selected user
      quickSendBtn.addEventListener('click', async () => {
        const selectedUserId = userSelect.value;
        const text = greetingInput.value.trim();
        const imageUrl = imageUrlInput.value.trim();

        if (!selectedUserId || !text) {
          alert('Please select a user account and enter a greeting message.');
          return;
        }

        quickSendBtn.disabled = true;
        quickSendBtn.innerText = "Sending...";

        const { error: insertError } = await window.supabaseClient
          .from('user_greetings')
          .insert({
            user_id: selectedUserId,
            admin_id: user.id,
            greeting_text: text,
            image_url: imageUrl || null
          });

        quickSendBtn.disabled = false;
        quickSendBtn.innerText = "Send Direct Greeting & Photo ✨";

        if (insertError) {
          alert('Error sending direct greeting: ' + insertError.message);
        } else {
          alert('Greeting and image successfully delivered to user account!');
          greetingInput.value = '';
          imageUrlInput.value = '';
          imagePreview.style.display = 'none';
        }
      });

      // Logout Handler
      adminLogoutBtn.addEventListener("click", async () => {
        await window.supabaseClient.auth.signOut();
        window.location.href = "admin-login.html";
      });

      // Initialize page data
      await loadRegisteredUsers();
      await loadFeedback();
    });
  </script>
</body>
</html>
