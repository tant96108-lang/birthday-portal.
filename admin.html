<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard - Birthday Portal</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .admin-container {
      width: 100%;
      max-width: 750px;
      margin: 40px auto;
      padding: 20px;
    }
    .admin-card {
      background: #ffffff;
      border: 2px solid #fecfef;
      border-radius: 16px;
      padding: 25px;
      box-shadow: 0 4px 15px rgba(255, 154, 158, 0.15);
      margin-bottom: 25px;
    }
    .admin-card h3 {
      color: #d63384;
      margin-top: 0;
      margin-bottom: 15px;
    }
    .form-group {
      margin-bottom: 15px;
    }
    .form-group label {
      display: block;
      font-weight: 600;
      color: #d63384;
      margin-bottom: 5px;
    }
    .form-group input, .form-group textarea {
      width: 100%;
      padding: 10px;
      border: 2px solid #e9ecef;
      border-radius: 10px;
      box-sizing: border-box;
      font-family: inherit;
    }
    .feedback-item {
      background: #fff5f8;
      border: 1px solid #fecfef;
      border-radius: 10px;
      padding: 15px;
      margin-bottom: 10px;
    }
    .feedback-user {
      font-weight: bold;
      color: #d63384;
    }
    .feedback-time {
      font-size: 0.8rem;
      color: #888;
    }
  </style>
</head>
<body class="birthday-bg">

  <div class="admin-container">
    <!-- Header -->
    <div class="admin-card" style="display: flex; justify-content: space-between; align-items: center;">
      <h2>👑 Admin Control Panel</h2>
      <button id="adminLogoutBtn" class="celebration-btn" style="width: auto; padding: 8px 16px;">Log Out</button>
    </div>

    <!-- Send Greeting Form -->
    <div class="admin-card">
      <h3>💌 Send Birthday Greeting to Celebrant</h3>
      <form id="sendGreetingForm">
        <div class="form-group">
          <label for="targetEmail">Celebrant's Email / Unique ID</label>
          <input type="text" id="targetEmail" placeholder="e.g. mimi.2000-01-01@birthday.com" required>
        </div>
        <div class="form-group">
          <label for="greetingMsg">Special Greeting Message</label>
          <textarea id="greetingMsg" rows="4" placeholder="Write your heartfelt birthday wishes..." required></textarea>
        </div>
        <button type="submit" id="sendBtn" class="primary-btn celebration-btn">✨ Send Greeting</button>
      </form>
    </div>

    <!-- Feedback View Feed -->
    <div class="admin-card">
      <h3>💬 Received Celebrant Feedback</h3>
      <div id="feedbackList">
        <p style="color: #6c757d; font-style: italic;">Loading feedback messages...</p>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabaseClient.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", async () => {
      const sendForm = document.getElementById("sendGreetingForm");
      const targetEmail = document.getElementById("targetEmail");
      const greetingMsg = document.getElementById("greetingMsg");
      const sendBtn = document.getElementById("sendBtn");
      const feedbackList = document.getElementById("feedbackList");
      const adminLogoutBtn = document.getElementById("adminLogoutBtn");

      // Verify Admin Authentication and Admin Metadata Role
      const { data: { user }, error } = await window.supabaseClient.auth.getUser();

      const isAdmin = user?.user_metadata?.role === "admin" || user?.app_metadata?.role === "admin";

      if (!user || error || !isAdmin) {
        alert("Unauthorized access. Redirecting to login...");
        window.location.href = "admin-login.html";
        return;
      }

      // Load all feedback from celebrants
      async function loadFeedback() {
        const { data, error } = await window.supabaseClient
          .from("greetings")
          .select("*")
          .not("feedback", "is", null)
          .order("created_at", { ascending: false });

        if (error) {
          feedbackList.innerHTML = `<p style="color:red;">Error loading feedback.</p>`;
          return;
        }

        if (!data || data.length === 0) {
          feedbackList.innerHTML = `<p style="color:#6c757d;">No feedback received yet.</p>`;
          return;
        }

        feedbackList.innerHTML = "";
        data.forEach(item => {
          const div = document.createElement("div");
          div.className = "feedback-item";
          div.innerHTML = `
            <div class="feedback-user">👤 ${item.name || item.recipient_email || item.celebrant_email || 'Celebrant'}</div>
            <p style="margin: 8px 0;">"${escapeHTML(item.feedback)}"</p>
            <div class="feedback-time">${new Date(item.created_at).toLocaleString()}</div>
          `;
          feedbackList.appendChild(div);
        });
      }

      function escapeHTML(str) {
        return str.replace(/[&<>'"]/g, tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag));
      }

      // Send Greeting Handler
      sendForm.addEventListener("submit", async (e) => {
        e.preventDefault();
        sendBtn.disabled = true;
        sendBtn.innerText = "Sending...";

        const emailVal = targetEmail.value.trim();
        const msgVal = greetingMsg.value.trim();

        // Extract a default name from the email prefix (e.g. "mimi" from "mimi@birthday.com")
        const defaultName = emailVal.split("@")[0] || "Celebrant";

        const { error } = await window.supabaseClient
          .from("greetings")
          .insert([
            { 
              recipient_email: emailVal, 
              message: msgVal, 
              name: defaultName 
            }
          ]);

        sendBtn.disabled = false;
        sendBtn.innerText = "✨ Send Greeting";

        if (error) {
          alert("Error sending greeting: " + error.message);
        } else {
          alert("Greeting sent successfully! 🎉");
          greetingMsg.value = "";
        }
      });

      // Logout
      adminLogoutBtn.addEventListener("click", async () => {
        await window.supabaseClient.auth.signOut();
        window.location.href = "admin-login.html";
      });

      await loadFeedback();
    });
  </script>
</body>
</html>
