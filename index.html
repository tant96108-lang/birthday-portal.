<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Birthday Portal - Login</title>
  <style>
    :root {
      --primary-color: #e60023;       /* Rose Red */
      --primary-hover: #b3001b;       /* Dark Crimson */
      --secondary-color: #8b0000;     /* Deep Velvet Red */
      --accent-color: #f8d7da;        /* Soft Blush Pink/Rose Highlight */
      --bg-gradient-1: #800020;       /* Burgundy */
      --bg-gradient-2: #cc0000;       /* Vibrant Rose Red */
      --card-bg: rgba(255, 255, 255, 0.95);
      --text-main: #2b0006;
      --border-radius-lg: 20px;
      --border-radius-md: 12px;
      --box-shadow: 0 10px 25px rgba(139, 0, 0, 0.25);
      --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body, html { height: 100%; font-family: var(--font-family); color: var(--text-main); overflow-x: hidden; }

    .birthday-bg {
      background: linear-gradient(135deg, var(--bg-gradient-1) 0%, var(--bg-gradient-2) 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    /* Floating Background Decorations */
    .balloon, .confetti {
      position: fixed;
      font-size: 2.5rem;
      user-select: none;
      pointer-events: none;
      z-index: 1;
      opacity: 0.8;
    }
    .balloon-1 { left: 5%; bottom: -50px; animation: floatUp 8s infinite ease-in-out; }
    .balloon-2 { right: 5%; bottom: -50px; animation: floatUp 10s infinite ease-in-out 3s; }
    .confetti-1 { left: 15%; top: 10%; animation: spin 6s infinite linear; }
    .confetti-2 { right: 15%; top: 20%; animation: spin 8s infinite linear reverse; }

    /* Login Screen */
    #login-view {
      width: 100%;
      max-width: 400px;
      padding: 20px;
      z-index: 10;
    }

    .card {
      background: var(--card-bg);
      border-radius: var(--border-radius-lg);
      padding: 30px;
      box-shadow: var(--box-shadow);
      border: 2px solid var(--accent-color);
      text-align: center;
    }

    .card h2 { color: var(--secondary-color); margin-bottom: 15px; }

    .input-group { margin-bottom: 15px; text-align: left; }
    .input-group label { display: block; font-size: 0.85rem; font-weight: bold; margin-bottom: 5px; }
    .input-group input {
      width: 100%; padding: 12px; border: 2px solid #f5c6cb;
      border-radius: var(--border-radius-md); font-size: 1rem;
    }

    .primary-btn {
      width: 100%; padding: 14px; border: none; border-radius: var(--border-radius-md);
      background: linear-gradient(45deg, var(--primary-color), var(--secondary-color));
      color: #fff; font-size: 1rem; font-weight: bold; cursor: pointer;
      box-shadow: 0 4px 15px rgba(139, 0, 0, 0.35); transition: 0.2s;
    }
    .primary-btn:hover { background: linear-gradient(45deg, var(--primary-hover), var(--secondary-color)); }

    /* Fullscreen Intro Overlay */
    #intro-overlay {
      position: fixed; inset: 0; background-color: var(--primary-color);
      display: none; flex-direction: column; justify-content: center; align-items: center;
      z-index: 1000; opacity: 0; transition: opacity 0.8s ease-in-out;
    }

    .cake-container { opacity: 0; transform: scale(0.5); transition: all 1s ease-out; text-align: center; }
    .cake-emoji { font-size: 6rem; animation: bounce 2s infinite ease-in-out; }
    .cake-text { color: #fff; font-size: 2.5rem; margin-top: 15px; font-weight: bold; text-shadow: 0 4px 10px rgba(0,0,0,0.3); }

    @keyframes floatUp {
      0% { transform: translateY(0) rotate(0deg); opacity: 0; }
      20% { opacity: 0.8; }
      100% { transform: translateY(-110vh) rotate(20deg); opacity: 0; }
    }
    @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
  </style>
</head>
<body class="birthday-bg">

  <!-- Background Floating Decorative Elements -->
  <div class="balloon balloon-1">🎈</div>
  <div class="balloon balloon-2">🎈</div>
  <div class="confetti confetti-1">✨</div>
  <div class="confetti confetti-2">🎉</div>

  <!-- LOGIN FORM -->
  <div id="login-view">
    <div class="card">
      <h2>Welcome Back</h2>
      <form id="login-form">
        <div class="input-group">
          <label for="loginEmail">Email / Username</label>
          <input type="email" id="loginEmail" required placeholder="Enter your email" />
        </div>
        <div class="input-group">
          <label for="loginPassword">Password</label>
          <input type="password" id="loginPassword" required placeholder="Enter password" />
        </div>
        <button type="submit" class="primary-btn" id="loginBtn">Login to Celebrate</button>
      </form>
    </div>
  </div>

  <!-- INTRO ANIMATION OVERLAY -->
  <div id="intro-overlay">
    <div class="cake-container" id="cake-box">
      <div class="cake-emoji">🎂🎈✨</div>
      <div class="cake-text">Happy Birthday!</div>
    </div>
  </div>

  <!-- Supabase CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- Global Supabase Client -->
  <script src="supabaseClient.js"></script>

  <script>
    document.addEventListener("DOMContentLoaded", async () => {
      const loginForm = document.getElementById("login-form");
      const loginView = document.getElementById("login-view");
      const loginBtn = document.getElementById("loginBtn");
      const introOverlay = document.getElementById("intro-overlay");
      const cakeBox = document.getElementById("cake-box");

      // Auto-redirect if user is already logged in
      if (window.supabaseClient) {
        const { data: { user } } = await window.supabaseClient.auth.getUser();
        if (user) {
          window.location.href = "dashboard.html";
          return;
        }
      }

      loginForm.addEventListener("submit", async (e) => {
        e.preventDefault();
        const email = document.getElementById("loginEmail").value.trim();
        const password = document.getElementById("loginPassword").value;

        loginBtn.disabled = true;
        loginBtn.innerText = "Signing in...";

        // Authenticate with Supabase
        const { data, error } = await window.supabaseClient.auth.signInWithPassword({
          email: email,
          password: password
        });

        if (error) {
          alert("Login failed: " + error.message);
          loginBtn.disabled = false;
          loginBtn.innerText = "Login to Celebrate";
          return;
        }

        // Trigger Full-Screen Red Intro & Cake Animation
        loginView.style.display = "none";
        introOverlay.style.display = "flex";
        
        setTimeout(() => {
          introOverlay.style.opacity = "1";
        }, 50);

        setTimeout(() => {
          cakeBox.style.opacity = "1";
          cakeBox.style.transform = "scale(1)";
        }, 800);

        // Redirect to Dashboard Page after transition completes
        setTimeout(() => {
          window.location.href = "dashboard.html";
        }, 3500);
      });
    });
  </script>
</body>
</html>
