<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Birthday Portal - Login</title>
  <style>
    /* Retro Arcade CSS Palette Sample */
    :root {
      --primary: #00f0ff;
      --secondary: #ff007f;
      --accent: #ffe600;
      --card-bg: rgba(18, 18, 32, 0.95);
      --text: #ffffff;
      --radius: 4px; /* Crisp pixel-style edges */
      --shadow: 0 0 15px rgba(0, 240, 255, 0.4);
      --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body, html { height: 100%; font-family: var(--font-family); color: var(--text); overflow-x: hidden; }

    .birthday-bg {
      background: #0d0d1a;
      background-image: radial-gradient(circle at 50% 50%, #1a1a3a 0%, #0d0d1a 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    /* Fullscreen Canvas Overlay for Fireworks & Confetti */
    #fxCanvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1001;
    }

    /* Floating Background Decorations */
    .balloon, .confetti {
      position: fixed;
      font-size: 2.5rem;
      user-select: none;
      pointer-events: none;
      z-index: 1;
      opacity: 0.8;
    }
    .balloon-1 { left: 5%; bottom: -50px; animation: floatUp 8s infinite ease-in-out; }
    .balloon-2 { right: 5%; bottom: -50px; animation: floatUp 10s infinite ease-in-out 3s; }
    .confetti-1 { left: 15%; top: 10%; animation: spin 6s infinite linear; }
    .confetti-2 { right: 15%; top: 20%; animation: spin 8s infinite linear reverse; }

    /* Dynamically Generated Floating Elements */
    .dynamic-element {
      position: fixed;
      bottom: -80px;
      font-size: 3.5rem;
      user-select: none;
      pointer-events: none;
      z-index: 1002;
      animation: floatUpDynamic linear forwards;
    }

    /* Floating Text Banner Effect */
    .floating-banner {
      position: fixed;
      top: 8%;
      font-size: 1.8rem;
      font-weight: 900;
      letter-spacing: 4px;
      color: var(--accent);
      text-transform: uppercase;
      text-shadow: 0 0 15px var(--accent);
      opacity: 0;
      transition: opacity 0.5s ease;
      z-index: 1003;
      animation: floatBanner 3s infinite ease-in-out;
    }

    /* Login Screen */
    #login-view {
      width: 100%;
      max-width: 400px;
      padding: 20px;
      z-index: 10;
    }

    .card {
      background: var(--card-bg);
      border-radius: var(--radius);
      padding: 30px;
      box-shadow: var(--shadow);
      border: 2px solid var(--primary);
      text-align: center;
      color: var(--text);
    }

    .card h2 {
      color: var(--secondary);
      margin-bottom: 15px;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      text-shadow: 0 0 8px rgba(255, 0, 127, 0.6);
    }

    .input-group { margin-bottom: 15px; text-align: left; }
    .input-group label {
      display: block;
      font-size: 0.85rem;
      font-weight: bold;
      margin-bottom: 5px;
      color: var(--primary);
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .input-group input {
      width: 100%;
      padding: 12px;
      background: rgba(0, 0, 0, 0.6);
      border: 1px solid var(--primary);
      border-radius: var(--radius);
      font-size: 1rem;
      color: var(--text);
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .input-group input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 10px rgba(255, 230, 0, 0.5);
    }

    .primary-btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: var(--radius);
      background: linear-gradient(45deg, var(--secondary), var(--primary));
      color: var(--text);
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 0 12px rgba(255, 0, 127, 0.5);
      transition: 0.2s;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .primary-btn:hover {
      background: linear-gradient(45deg, var(--primary), var(--secondary));
      box-shadow: 0 0 18px rgba(0, 240, 255, 0.8);
      transform: translateY(-1px);
    }

    /* Developer Credit Footer */
    .app-footer {
      margin-top: 12px;
      text-align: center;
      font-size: 0.78rem;
      color: var(--primary);
      letter-spacing: 0.8px;
      opacity: 0.85;
      text-shadow: 0 0 5px rgba(0, 240, 255, 0.4);
    }

    /* Fullscreen Intro Overlay */
    #intro-overlay {
      position: fixed;
      inset: 0;
      background-color: #0d0d1a;
      display: none;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      opacity: 0;
      transition: opacity 0.8s ease-in-out, background-color 1s ease;
    }

    /* Countdown Display */
    .countdown-timer {
      font-size: 6rem;
      font-weight: 900;
      color: var(--primary);
      text-shadow: 0 0 20px var(--primary);
      position: absolute;
      z-index: 1002;
      animation: pulseCount 0.8s infinite alternate;
    }

    .cake-container { 
      opacity: 0; 
      transform: scale(0.3); 
      transition: all 1.2s cubic-bezier(0.175, 0.885, 0.32, 1.275); 
      text-align: center;
      z-index: 1002;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* Stage Layout holding Teddy Bear and Flower Side-by-Side */
    .animation-stage {
      display: flex;
      align-items: flex-end;
      justify-content: center;
      gap: 15px;
    }
    
    .cake-text {
      font-size: 3.2rem;
      margin-top: 20px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 3px;
      background: linear-gradient(45deg, var(--secondary), var(--accent), var(--primary), #00e676);
      background-size: 300% 300%;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: rainbowShift 2.5s ease infinite;
      filter: drop-shadow(0 0 12px rgba(255, 230, 0, 0.8));
    }

    /* TEDDY BEAR ANIMATION */
    .teddy-wrapper {
      position: relative;
      width: 180px;
      height: 180px;
      animation: teddyFloat 2s infinite ease-in-out;
    }

    .teddy-svg {
      width: 100%;
      height: 100%;
      filter: drop-shadow(0 0 15px rgba(255, 0, 127, 0.4));
    }

    .left-ear { transform-origin: 50px 45px; animation: earWiggle 3s infinite ease-in-out; }
    .right-ear { transform-origin: 150px 45px; animation: earWiggle 3s infinite ease-in-out 0.5s; }
    .left-arm { transform-origin: 45px 125px; animation: waveArm 1.5s infinite ease-in-out alternate; }
    .right-arm { transform-origin: 155px 125px; animation: waveArmRight 1.5s infinite ease-in-out alternate; }
    .candle-flame { transform-origin: center bottom; animation: flameFlicker 0.6s infinite alternate ease-in-out; }

    /* ANIMATED FLOWER */
    .flower-wrapper {
      position: relative;
      width: 100px;
      height: 160px;
      animation: flowerSway 3s infinite ease-in-out alternate;
      transform-origin: bottom center;
    }

    .flower-svg {
      width: 100%;
      height: 100%;
      filter: drop-shadow(0 0 12px rgba(0, 240, 255, 0.5));
    }

    .flower-center { animation: pulseCenter 1.5s infinite alternate ease-in-out; }
    .flower-petal { transform-origin: 50px 40px; animation: petalGlow 2s infinite alternate ease-in-out; }
    .flower-leaf-left { transform-origin: 50px 100px; animation: leafPulse 2.5s infinite alternate ease-in-out; }
    .flower-leaf-right { transform-origin: 50px 110px; animation: leafPulse 2.5s infinite alternate ease-in-out 0.5s; }

    /* Keyframe Animations */
    @keyframes teddyFloat {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      50% { transform: translateY(-12px) rotate(2deg); }
    }
    @keyframes flowerSway {
      0% { transform: rotate(-5deg); }
      100% { transform: rotate(5deg); }
    }
    @keyframes earWiggle {
      0%, 100% { transform: rotate(0deg); }
      25% { transform: rotate(-8deg); }
      75% { transform: rotate(8deg); }
    }
    @keyframes waveArm {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(-15deg); }
    }
    @keyframes waveArmRight {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(15deg); }
    }
    @keyframes flameFlicker {
      0% { transform: scale(0.9) rotate(-3deg); filter: drop-shadow(0 0 6px #ffe600); }
      100% { transform: scale(1.2) rotate(3deg); filter: drop-shadow(0 0 15px #ff007f); }
    }
    @keyframes pulseCenter {
      0% { fill: #ffe600; filter: drop-shadow(0 0 2px #ffe600); }
      100% { fill: #ffffff; filter: drop-shadow(0 0 10px #ffe600); }
    }
    @keyframes petalGlow {
      0% { opacity: 0.85; }
      100% { opacity: 1; filter: drop-shadow(0 0 8px #ff007f); }
    }
    @keyframes leafPulse {
      0% { transform: scale(0.95); }
      100% { transform: scale(1.05); }
    }
    @keyframes floatUp {
      0% { transform: translateY(0) rotate(0deg); opacity: 0; }
      20% { opacity: 0.8; }
      100% { transform: translateY(-110vh) rotate(20deg); opacity: 0; }
    }
    @keyframes floatUpDynamic {
      0% { transform: translateY(0) rotate(0deg) scale(0.8); opacity: 1; }
      50% { transform: translateY(-60vh) rotate(15deg) scale(1.2); }
      100% { transform: translateY(-120vh) rotate(-20deg) scale(0.8); opacity: 0; }
    }
    @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    @keyframes rainbowShift {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
    @keyframes pulseCount {
      0% { transform: scale(0.9); opacity: 0.7; }
      100% { transform: scale(1.1); opacity: 1; }
    }
    @keyframes floatBanner {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }
  </style>
</head>
<body class="birthday-bg">

  <canvas id="fxCanvas"></canvas>

  <div class="floating-banner" id="banner-text">✨ CELEBRATION TIME ✨</div>

  <div class="balloon balloon-1">🎈</div>
  <div class="balloon balloon-2">🎈</div>
  <div class="confetti confetti-1">✨</div>
  <div class="confetti confetti-2">🎉</div>

  <div id="login-view">
    <div class="card">
      <h2>Welcome Back</h2>
      <form id="login-form">
        <div class="input-group">
          <label for="loginEmail">Firstname/gmail</label>
          <input type="email" id="loginEmail" required placeholder="Name@gmail.com" />
        </div>
        <div class="input-group">
          <label for="loginPassword">imong nickname</label>
          <input type="password" id="loginPassword" required placeholder="Enter nickname" />
        </div>
        <button type="submit" class="primary-btn" id="loginBtn">Login to Celebrate</button>
      </form>
    </div>

    <footer class="app-footer">
      <p>Developed by: © TANTAN,Student BSIS-3E</p>
    </footer>
  </div>

  <div id="intro-overlay">
    <div class="countdown-timer" id="timer-box">3</div>
    <div class="cake-container" id="cake-box">
      <div class="animation-stage">
        <div class="teddy-wrapper" id="teddy-wrapper">
          <svg class="teddy-svg" viewBox="0 0 200 200">
            <circle class="left-ear" cx="50" cy="45" r="22" fill="#a66e4e" stroke="#734325" stroke-width="4"/>
            <circle class="left-ear" cx="50" cy="45" r="12" fill="#d9a589"/>
            <circle class="right-ear" cx="150" cy="45" r="22" fill="#a66e4e" stroke="#734325" stroke-width="4"/>
            <circle class="right-ear" cx="150" cy="45" r="12" fill="#d9a589"/>
            
            <circle cx="100" cy="75" r="50" fill="#b87d5b" stroke="#734325" stroke-width="4"/>
            <ellipse cx="100" cy="85" rx="20" ry="15" fill="#e8c3a7"/>
            <ellipse cx="100" cy="78" rx="8" ry="6" fill="#3d2112"/>
            <circle cx="80" cy="68" r="5" fill="#1a0c06"/>
            <circle cx="120" cy="68" r="5" fill="#1a0c06"/>
            <circle cx="82" cy="66" r="2" fill="#ffffff"/>
            <circle cx="122" cy="66" r="2" fill="#ffffff"/>

            <path d="M 60,110 Q 100,100 140,110 Q 155,160 140,180 Q 100,190 60,180 Q 45,160 60,110 Z" fill="#a66e4e" stroke="#734325" stroke-width="4"/>

            <path class="left-arm" d="M 50,125 Q 30,140 70,155" fill="none" stroke="#a66e4e" stroke-width="18" stroke-linecap="round"/>
            <path class="right-arm" d="M 150,125 Q 170,140 130,155" fill="none" stroke="#a66e4e" stroke-width="18" stroke-linecap="round"/>

            <g transform="translate(60, 125)">
              <rect x="0" y="20" width="80" height="30" rx="4" fill="#ff007f" stroke="#ffffff" stroke-width="2"/>
              <rect x="10" y="5" width="60" height="20" rx="3" fill="#00f0ff" stroke="#ffffff" stroke-width="2"/>
              <path d="M 0,20 Q 10,28 20,20 Q 30,28 40,20 Q 50,28 60,20 Q 70,28 80,20 L 80,25 L 0,25 Z" fill="#ffffff"/>
              <rect x="38" y="-8" width="4" height="13" fill="#ffe600"/>
              <path class="candle-flame" d="M 40,-18 Q 45,-12 40,-6 Q 35,-12 40,-18 Z" fill="#ffea00"/>
            </g>
          </svg>
        </div>

        <div class="flower-wrapper">
          <svg class="flower-svg" viewBox="0 0 100 160">
            <path d="M 50,160 Q 45,110 50,40" stroke="#00e676" stroke-width="6" fill="none" stroke-linecap="round"/>
            <path class="flower-leaf-left" d="M 48,110 Q 20,100 25,85 Q 40,90 48,110 Z" fill="#00c853"/>
            <path class="flower-leaf-right" d="M 52,95 Q 80,85 75,70 Q 60,75 52,95 Z" fill="#00c853"/>
            <g class="flower-petal">
              <circle cx="50" cy="20" r="14" fill="#ff007f"/>
              <circle cx="70" cy="40" r="14" fill="#ff007f"/>
              <circle cx="50" cy="60" r="14" fill="#ff007f"/>
              <circle cx="30" cy="40" r="14" fill="#ff007f"/>
              <circle cx="36" cy="26" r="14" fill="#ff4081"/>
              <circle cx="64" cy="26" r="14" fill="#ff4081"/>
              <circle cx="64" cy="54" r="14" fill="#ff4081"/>
              <circle cx="36" cy="54" r="14" fill="#ff4081"/>
            </g>
            <circle class="flower-center" cx="50" cy="40" r="12" fill="#ffe600"/>
          </svg>
        </div>
      </div>

      <div class="cake-text">Happy Birthday!</div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabaseClient.js"></script>

  <script>
    // Canvas & Animation Setup
    const canvas = document.getElementById("fxCanvas");
    const ctx = canvas.getContext("2d");
    let particles = [];
    const colors = ["#00f0ff", "#ff007f", "#ffe600", "#00e676", "#ffffff", "#d500f9"];

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    resizeCanvas();
    window.addEventListener("resize", resizeCanvas);

    class Particle {
      constructor(x, y, type) {
        this.x = x;
        this.y = y;
        this.type = type; // 'firework' or 'confetti'
        this.color = colors[Math.floor(Math.random() * colors.length)];
        const angle = Math.random() * Math.PI * 2;
        const speed = type === 'firework' ? Math.random() * 8 + 3 : Math.random() * 6 + 1.5;
        this.vx = Math.cos(angle) * speed;
        this.vy = Math.sin(angle) * speed - (type === 'confetti' ? 2 : 0);
        this.alpha = 1;
        this.decay = Math.random() * 0.012 + 0.005;
        this.size = type === 'firework' ? Math.random() * 4 + 2 : Math.random() * 8 + 4;
        this.gravity = type === 'firework' ? 0.05 : 0.07;
        this.rotation = Math.random() * 360;
        this.rotationSpeed = (Math.random() - 0.5) * 12;
      }

      update() {
        this.x += this.vx;
        this.y += this.vy;
        this.vy += this.gravity;
        this.alpha -= this.decay;
        this.rotation += this.rotationSpeed;
      }

      draw() {
        ctx.save();
        ctx.globalAlpha = Math.max(this.alpha, 0);
        ctx.fillStyle = this.color;
        if (this.type === 'firework') {
          ctx.beginPath();
          ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
          ctx.fill();
        } else {
          ctx.translate(this.x, this.y);
          ctx.rotate((this.rotation * Math.PI) / 180);
          ctx.fillRect(-this.size / 2, -this.size / 2, this.size, this.size * 1.5);
        }
        ctx.restore();
      }
    }

    function createFirework(x, y) {
      for (let i = 0; i < 60; i++) {
        particles.push(new Particle(x, y, 'firework'));
      }
    }

    function createConfettiBurst() {
      const x = Math.random() * canvas.width;
      const y = Math.random() * (canvas.height * 0.5);
      for (let i = 0; i < 45; i++) {
        particles.push(new Particle(x, y, 'confetti'));
      }
    }

    function spawnDynamicElement() {
      const el = document.createElement("div");
      el.className = "dynamic-element";
      const items = ["🎈", "🌸", "🎉", "✨", "🌺", "🎂", "🧸", "🌻", "🎁", "🌼", "🌷", "🔴", "🟣", "🟡"];
      el.innerText = items[Math.floor(Math.random() * items.length)];
      el.style.left = `${Math.random() * 90 + 5}%`;
      const duration = Math.random() * 3 + 4;
      el.style.animationDuration = `${duration}s`;
      document.body.appendChild(el);
      setTimeout(() => el.remove(), duration * 1000);
    }

    function animateFX() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      for (let i = particles.length - 1; i >= 0; i--) {
        particles[i].update();
        particles[i].draw();
        if (particles[i].alpha <= 0) particles.splice(i, 1);
      }
      requestAnimationFrame(animateFX);
    }
    animateFX();

    // Multi-Stage Extended Animation Sequence (8-second duration)
    function runExtendedSequence() {
      const timerBox = document.getElementById("timer-box");
      const cakeBox = document.getElementById("cake-box");
      const bannerText = document.getElementById("banner-text");
      const introOverlay = document.getElementById("intro-overlay");

      // STAGE 1: Countdown (0s - 2s)
      let count = 3;
      timerBox.innerText = count;
      const countInterval = setInterval(() => {
        count--;
        if (count > 0) {
          timerBox.innerText = count;
          spawnDynamicElement();
        } else {
          clearInterval(countInterval);
          timerBox.style.display = "none";
          
          // STAGE 2: Reveal Teddy, Cake & Flower (2s - 4s)
          cakeBox.style.opacity = "1";
          cakeBox.style.transform = "scale(1)";
          bannerText.style.opacity = "1";

          for (let i = 0; i < 4; i++) {
            setTimeout(() => {
              createFirework(Math.random() * canvas.width, Math.random() * (canvas.height * 0.5));
              createConfettiBurst();
              spawnDynamicElement();
            }, i * 250);
          }
        }
      }, 600);

      // STAGE 3: Heavy Fireworks Barrage (4s - 6s)
      setTimeout(() => {
        introOverlay.style.backgroundColor = "#070712";
        let barrageCount = 0;
        const barrageInterval = setInterval(() => {
          createFirework(Math.random() * canvas.width, Math.random() * (canvas.height * 0.6));
          createConfettiBurst();
          spawnDynamicElement();
          barrageCount++;
          if (barrageCount > 12) clearInterval(barrageInterval);
        }, 150);
      }, 3800);

      // STAGE 4: Grand Finale Burst (6s - 8s)
      setTimeout(() => {
        bannerText.innerText = "🎉 PARTY TIME! REDIRECTING... 🎉";
        
        for (let i = 0; i < 8; i++) {
          setTimeout(() => {
            createFirework(canvas.width * 0.2, canvas.height * 0.4);
            createFirework(canvas.width * 0.8, canvas.height * 0.4);
            createConfettiBurst();
            spawnDynamicElement();
          }, i * 200);
        }
      }, 5800);

      // Final Redirect at 8 Seconds
      setTimeout(() => {
        window.location.href = "dashboard.html";
      }, 8000);
    }

    document.addEventListener("DOMContentLoaded", async () => {
      const loginForm = document.getElementById("login-form");
      const loginView = document.getElementById("login-view");
      const loginBtn = document.getElementById("loginBtn");
      const introOverlay = document.getElementById("intro-overlay");

      // Auto-redirect if user is already logged in
      if (window.supabaseClient) {
        const { data: { user } } = await window.supabaseClient.auth.getUser();
        if (user) {
          window.location.href = "dashboard.html";
          return;
        }
      }

      loginForm.addEventListener("submit", async (e) => {
        e.preventDefault();
        const email = document.getElementById("loginEmail").value.trim();
        const password = document.getElementById("loginPassword").value;

        loginBtn.disabled = true;
        loginBtn.innerText = "Signing in...";

        // Authenticate with Supabase
        const { data, error } = await window.supabaseClient.auth.signInWithPassword({
          email: email,
          password: password
        });

        if (error) {
          alert("Login failed: " + error.message);
          loginBtn.disabled = false;
          loginBtn.innerText = "Login to Celebrate";
          return;
        }

        // Trigger Long Intro Animation Sequence
        loginView.style.display = "none";
        introOverlay.style.display = "flex";
        
        setTimeout(() => {
          introOverlay.style.opacity = "1";
          runExtendedSequence();
        }, 50);
      });
    });
  </script>
</body>
</html>
