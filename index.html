<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Birthday Portal - Login</title>
  <style>
    /* Retro Arcade CSS Palette Sample */
    :root {
      --primary: #00f0ff;
      --secondary: #ff007f;
      --accent: #ffe600;
      --card-bg: rgba(18, 18, 32, 0.95);
      --text: #ffffff;
      --radius: 4px; /* Crisp pixel-style edges */
      --shadow: 0 0 15px rgba(0, 240, 255, 0.4);
      --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body, html { height: 100%; font-family: var(--font-family); color: var(--text); overflow-x: hidden; }

    .birthday-bg {
      background: #0d0d1a;
      background-image: radial-gradient(circle at 50% 50%, #1a1a3a 0%, #0d0d1a 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    /* Floating Background Decorations */
    .balloon, .confetti {
      position: fixed;
      font-size: 2.5rem;
      user-select: none;
      pointer-events: none;
      z-index: 1;
      opacity: 0.8;
    }
    .balloon-1 { left: 5%; bottom: -50px; animation: floatUp 8s infinite ease-in-out; }
    .balloon-2 { right: 5%; bottom: -50px; animation: floatUp 10s infinite ease-in-out 3s; }
    .confetti-1 { left: 15%; top: 10%; animation: spin 6s infinite linear; }
    .confetti-2 { right: 15%; top: 20%; animation: spin 8s infinite linear reverse; }

    /* Login Screen */
    #login-view {
      width: 100%;
      max-width: 400px;
      padding: 20px;
      z-index: 10;
    }

    .card {
      background: var(--card-bg);
      border-radius: var(--radius);
      padding: 30px;
      box-shadow: var(--shadow);
      border: 2px solid var(--primary);
      text-align: center;
      color: var(--text);
    }

    .card h2 {
      color: var(--secondary);
      margin-bottom: 15px;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      text-shadow: 0 0 8px rgba(255, 0, 127, 0.6);
    }

    .input-group { margin-bottom: 15px; text-align: left; }
    .input-group label {
      display: block;
      font-size: 0.85rem;
      font-weight: bold;
      margin-bottom: 5px;
      color: var(--primary);
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .input-group input {
      width: 100%;
      padding: 12px;
      background: rgba(0, 0, 0, 0.6);
      border: 1px solid var(--primary);
      border-radius: var(--radius);
      font-size: 1rem;
      color: var(--text);
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .input-group input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 10px rgba(255, 230, 0, 0.5);
    }

    .primary-btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: var(--radius);
      background: linear-gradient(45deg, var(--secondary), var(--primary));
      color: var(--text);
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 0 12px rgba(255, 0, 127, 0.5);
      transition: 0.2s;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .primary-btn:hover {
      background: linear-gradient(45deg, var(--primary), var(--secondary));
      box-shadow: 0 0 18px rgba(0, 240, 255, 0.8);
      transform: translateY(-1px);
    }

    /* Developer Credit (Positioned directly under the login card) */
    .app-footer {
      margin-top: 12px;
      text-align: center;
      font-size: 0.78rem;
      color: var(--primary);
      letter-spacing: 0.8px;
      opacity: 0.85;
      text-shadow: 0 0 5px rgba(0, 240, 255, 0.4);
    }

    /* Fullscreen Intro Overlay */
    #intro-overlay {
      position: fixed;
      inset: 0;
      background-color: #0d0d1a;
      display: none;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      opacity: 0;
      transition: opacity 0.8s ease-in-out;
    }

    .cake-container { opacity: 0; transform: scale(0.5); transition: all 1s ease-out; text-align: center; }
    .cake-emoji { font-size: 6rem; animation: bounce 2s infinite ease-in-out; }
    .cake-text {
      color: var(--accent);
      font-size: 2.5rem;
      margin-top: 15px;
      font-weight: bold;
      text-shadow: 0 0 15px rgba(255, 230, 0, 0.8);
      text-transform: uppercase;
      letter-spacing: 2px;
    }

    @keyframes floatUp {
      0% { transform: translateY(0) rotate(0deg); opacity: 0; }
      20% { opacity: 0.8; }
      100% { transform: translateY(-110vh) rotate(20deg); opacity: 0; }
    }
    @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
  </style>
</head>
<body class="birthday-bg">

  <!-- Background Floating Decorative Elements -->
  <div class="balloon balloon-1">🎈</div>
  <div class="balloon balloon-2">🎈</div>
  <div class="confetti confetti-1">✨</div>
  <div class="confetti confetti-2">🎉</div>

  <!-- LOGIN FORM -->
  <div id="login-view">
    <div class="card">
      <h2>Welcome Back</h2>
      <form id="login-form">
        <div class="input-group">
          <label for="loginEmail">Email / Username</label>
          <input type="email" id="loginEmail" required placeholder="Enter your email" />
        </div>
        <div class="input-group">
          <label for="loginPassword">Password</label>
          <input type="password" id="loginPassword" required placeholder="Enter password" />
        </div>
        <button type="submit" class="primary-btn" id="loginBtn">Login to Celebrate</button>
      </form>
    </div>

    <!-- Developer Credit Footer -->
    <footer class="app-footer">
      <p>Developed by: © TANTAN,Student BSIS-3E</p>
    </footer>
  </div>

  <!-- INTRO ANIMATION OVERLAY -->
  <div id="intro-overlay">
    <div class="cake-container" id="cake-box">
      <div class="cake-emoji">🎂🎈✨</div>
      <div class="cake-text">Happy Birthday!</div>
    </div>
  </div>

  <!-- Supabase CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- Global Supabase Client -->
  <script src="supabaseClient.js"></script>

  <script>
    document.addEventListener("DOMContentLoaded", async () => {
      const loginForm = document.getElementById("login-form");
      const loginView = document.getElementById("login-view");
      const loginBtn = document.getElementById("loginBtn");
      const introOverlay = document.getElementById("intro-overlay");
      const cakeBox = document.getElementById("cake-box");

      // Auto-redirect if user is already logged in
      if (window.supabaseClient) {
        const { data: { user } } = await window.supabaseClient.auth.getUser();
        if (user) {
          window.location.href = "dashboard.html";
          return;
        }
      }

      loginForm.addEventListener("submit", async (e) => {
        e.preventDefault();
        const email = document.getElementById("loginEmail").value.trim();
        const password = document.getElementById("loginPassword").value;

        loginBtn.disabled = true;
        loginBtn.innerText = "Signing in...";

        // Authenticate with Supabase
        const { data, error } = await window.supabaseClient.auth.signInWithPassword({
          email: email,
          password: password
        });

        if (error) {
          alert("Login failed: " + error.message);
          loginBtn.disabled = false;
          loginBtn.innerText = "Login to Celebrate";
          return;
        }

        // Trigger Full-Screen Intro & Cake Animation
        loginView.style.display = "none";
        introOverlay.style.display = "flex";
        
        setTimeout(() => {
          introOverlay.style.opacity = "1";
        }, 50);

        setTimeout(() => {
          cakeBox.style.opacity = "1";
          cakeBox.style.transform = "scale(1)";
        }, 800);

        // Redirect to Dashboard Page after transition completes
        setTimeout(() => {
          window.location.href = "dashboard.html";
        }, 3500);
      });
    });
  </script>
</body>
</html>
